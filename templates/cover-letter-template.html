<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <style>
    @font-face {
      font-family: 'Space Grotesk';
      src: url('./fonts/space-grotesk-latin.woff2') format('woff2');
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'DM Sans';
      src: url('./fonts/dm-sans-latin.woff2') format('woff2');
      font-weight: 100 1000;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      line-height: 1.6;
      color: #1a1a2e;
      background: #ffffff;
      margin: 0;
      padding: 0;
    }

    .page {
      width: 100%;
      max-width: {{PAGE_WIDTH}};
      margin: 0 auto;
      padding: 0;
    }

    .letter {
      white-space: normal;
    }

    .letter p { margin: 0 0 10px 0; }
    .letter .tight { margin-bottom: 4px; }
    .letter ul { margin: 6px 0 10px 18px; padding: 0; }
    .letter li { margin: 0 0 6px 0; }

    .mono-url { white-space: nowrap; }

    @media print {
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="letter">
      {{BODY}}
    </div>
  </div>
</body>
</html>
